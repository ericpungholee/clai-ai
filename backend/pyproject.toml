[project]
name = "clai-backend"
version = "0.1.0"
description = "Clai API and background workers"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "boto3>=1.40,<2",
    "celery[redis]>=5.4",
    "fal-client>=1.0,<2",
    "fastapi>=0.115",
    "httpx>=0.28",
    "numpy>=2.0,<3",
    "pillow>=11,<13",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "redis>=5.2",
    "scipy>=1.15,<2",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["postgres: requires PostgreSQL"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["app", "tests"]
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
