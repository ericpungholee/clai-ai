services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-clai}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clai} -d ${POSTGRES_DB:-clai}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 10s

  postgres-test:
    image: postgres:16-alpine
    profiles: ["test"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clai} -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    stop_grace_period: 10s

  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-clai}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-clai}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
    command: >
      sh -c "uv sync && uv run alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 10s
    init: true

  worker:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-clai}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-clai}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
      - worker_venv:/app/.venv
    command: >
      sh -c "uv sync --no-dev && celery -A app.workers.celery_app:celery_app worker --loglevel=info"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 20s
    init: true

  frontend:
    build:
      context: ./frontend
    environment:
      API_INTERNAL_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
      # Both decoders must stay pinned to the same real SAM response.
      - ./backend/tests/fixtures/sam-3-image-rle.json:/backend/tests/fixtures/sam-3-image-rle.json:ro
    # The persistent dependency volume can outlive the image that populated it.
    command: >
      sh -c "npm ci --no-audit --no-fund && exec npm run dev -- --hostname 0.0.0.0 --port 3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 10s
    init: true

  backend-test:
    build:
      context: ./backend
    profiles: ["test"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-clai}:${POSTGRES_PASSWORD}@postgres-test:5432/postgres
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-clai}:${POSTGRES_PASSWORD}@postgres-test:5432/postgres
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
      - backend_test_venv:/app/.venv
    command: uv run pytest -m postgres
    depends_on:
      postgres-test:
        condition: service_healthy

volumes:
  postgres_data:
  backend_venv:
  worker_venv:
  frontend_node_modules:
  frontend_next:
  backend_test_venv:
